<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pocket Lite{% endblock %}</title>

    <!-- Google Fonts - Elegant Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Light Mode - Warm Parchment */
            --bg-color: #FAF8F5;
            --bg-secondary: #F3F0EB;
            --text-color: #2C2C2C;
            --text-secondary: #6B6B6B;
            --text-muted: #9A9A9A;
            --accent-color: #B8472D;
            --accent-hover: #9A3A24;
            --border-color: #E8E4DE;
            --shadow-color: rgba(44, 44, 44, 0.06);
            --toolbar-bg: rgba(250, 248, 245, 0.92);
            --grain-opacity: 0.03;
        }

        body.night-mode {
            /* Dark Mode - Deep Ink */
            --bg-color: #0F1419;
            --bg-secondary: #1A2028;
            --text-color: #E7E9EA;
            --text-secondary: #A0A8B0;
            --text-muted: #6E767D;
            --accent-color: #E8694A;
            --accent-hover: #F28066;
            --border-color: #2F3842;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --toolbar-bg: rgba(15, 20, 25, 0.92);
            --grain-opacity: 0.015;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle paper grain texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: var(--grain-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            z-index: 9999;
        }

        .container-reading {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent-hover);
        }

        /* Selection */
        ::selection {
            background-color: var(--accent-color);
            color: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
